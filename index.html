<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЗАФК — Познайомся з викладачами IT</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#070809;
  --fg:#f5f6f3;
  --muted:#858b94;
  --line:#272b31;
  --lime:#d9ff3f;
  --blue:#36a9e1;
  --card:#101216;
  --soft:#171a1f;
}

*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--fg);
  font-family:Inter,system-ui,sans-serif;
}
body{touch-action:none}
button{font:inherit}

.app{
  width:100%;height:100dvh;overflow:hidden;position:relative;
  background:
    radial-gradient(circle at 82% 15%,rgba(54,169,225,.055),transparent 25%),
    radial-gradient(circle at 8% 88%,rgba(217,255,63,.045),transparent 25%),
    #070809;
}
.stage{
  height:100%;display:flex;
  transition:transform .72s cubic-bezier(.2,.8,.2,1);
  will-change:transform;
}
.slide{min-width:100%;height:100%;position:relative;isolation:isolate}

/* HEADER */
.top{
  position:absolute;z-index:50;top:18px;left:30px;right:30px;
  display:flex;justify-content:space-between;align-items:center;
  pointer-events:none;
}
.logo{
  font-size:10px;font-weight:900;letter-spacing:.18em;
  color:#dfe2e5;
}
.counter{
  font-size:10px;color:#6e747d;letter-spacing:.10em;
}
.progress{
  position:absolute;z-index:50;top:14px;left:50%;
  transform:translateX(-50%);display:flex;gap:4px;
  width:min(480px,58vw);pointer-events:none;
}
.progress span{
  height:2px;flex:1;border-radius:99px;background:#25282d;
  transition:.25s ease;
}
.progress span.on{background:var(--lime);box-shadow:0 0 12px rgba(217,255,63,.18)}

/* INTRO */
.intro{
  min-width:100%;height:100%;position:relative;
  display:grid;place-items:center;text-align:center;
  overflow:hidden;padding:30px;
  background:
    radial-gradient(circle at 50% 42%,rgba(217,255,63,.10),transparent 24%),
    radial-gradient(circle at 15% 80%,rgba(54,169,225,.075),transparent 24%),
    #070809;
}
.intro-grid{
  position:absolute;inset:-20%;opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:46px 46px;
  transform:perspective(700px) rotateX(68deg) translateY(17%);
  animation:gridMove 16s linear infinite;
}
@keyframes gridMove{
  from{background-position:0 0,0 0}
  to{background-position:0 46px,46px 0}
}
.orb{
  position:absolute;border-radius:50%;pointer-events:none;
}
.orb.a{
  width:13vw;height:13vw;min-width:90px;min-height:90px;
  border:1px solid rgba(54,169,225,.18);
  box-shadow:0 0 90px rgba(54,169,225,.08);
  top:10%;left:10%;animation:orbA 10s ease-in-out infinite;
}
.orb.b{
  width:8vw;height:8vw;min-width:55px;min-height:55px;
  border:1px solid rgba(217,255,63,.14);
  right:13%;bottom:13%;animation:orbB 8s ease-in-out infinite;
}
@keyframes orbA{0%,100%{transform:translate(0,0)}50%{transform:translate(65px,35px)}}
@keyframes orbB{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,-25px)}}

.intro-content{position:relative;z-index:3;max-width:1080px;width:100%}

.college-mark{
  display:flex;justify-content:center;align-items:center;
  margin:0 auto 14px;
  animation:fadeUp .8s both;
}
.college-mark img{
  width:150px;height:auto;display:block;
  filter:drop-shadow(0 12px 25px rgba(0,0,0,.32));
}
.intro-overline{
  color:#8e959d;font-size:11px;font-weight:800;
  letter-spacing:.20em;text-transform:uppercase;
  margin-bottom:20px;animation:fadeUp .8s .06s both;
}
.intro h2{
  font-size:clamp(55px,8.5vw,132px);
  line-height:.82;letter-spacing:-.095em;
  margin:0 0 26px;animation:fadeUp .9s .10s both;
}
.intro h2 .accent{
  color:var(--lime);display:inline-block;
  text-shadow:0 0 45px rgba(217,255,63,.10);
}
.intro-lead{
  max-width:780px!important;
  color:#b8bdc4!important;
  line-height:1.65!important;
  font-size:16px!important;
  margin:0 auto 23px!important;
  animation:fadeUp .9s .17s both;
}
.intro-lead b{color:#f4f5f2}
.intro-tease{
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;
  gap:9px;margin:0 auto 29px;
  color:#777d86;font-size:11px;font-weight:700;
  animation:fadeUp .9s .22s both;
}
.intro-tease span{
  border:1px solid #2d3137;background:rgba(255,255,255,.025);
  border-radius:999px;padding:9px 13px;
}
.intro-tease span:first-child{
  color:var(--lime);border-color:rgba(217,255,63,.24);
}
.intro-tease i{color:#454a51;font-style:normal}
.start{
  position:relative;overflow:hidden;border:0;border-radius:999px;
  background:var(--lime);color:#10120a;padding:15px 23px;
  font-size:11px;font-weight:900;letter-spacing:.10em;
  cursor:pointer;box-shadow:0 0 0 0 rgba(217,255,63,.2);
  animation:fadeUp .9s .28s both,buttonPulse 2.5s 1.4s ease-in-out infinite;
  transition:.2s ease;
}
.start::after{
  content:"";position:absolute;inset:0;width:32%;
  transform:translateX(-140%) skewX(-18deg);
  background:rgba(255,255,255,.34);animation:shine 3.4s 1.5s infinite;
}
.start:hover{transform:translateY(-2px) scale(1.02)}
@keyframes shine{0%,55%,100%{transform:translateX(-140%) skewX(-18deg)}70%{transform:translateX(430%) skewX(-18deg)}}
@keyframes buttonPulse{0%,100%{box-shadow:0 0 0 0 rgba(217,255,63,0)}50%{box-shadow:0 0 0 9px rgba(217,255,63,.055)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.intro-foot{
  margin-top:18px;color:#4c5259;font-size:8px;
  letter-spacing:.14em;text-transform:uppercase;
  animation:fadeUp .9s .34s both;
}

/* PROFILE SLIDE */
.profile{
  height:100%;display:grid;
  grid-template-columns:minmax(380px,.82fr) minmax(0,1.18fr);
  gap:0;
  background:
    radial-gradient(circle at 15% 40%,rgba(54,169,225,.045),transparent 30%),
    #08090b;
}

/* portrait side */
.portrait-zone{
  position:relative;min-width:0;display:flex;align-items:center;justify-content:center;
  padding:76px clamp(28px,5vw,75px) 52px;
  overflow:hidden;
  border-right:1px solid rgba(255,255,255,.07);
}
.portrait-zone::before{
  content:"";position:absolute;width:72%;height:72%;
  border-radius:50%;background:rgba(54,169,225,.06);
  filter:blur(60px);pointer-events:none;
}
.portrait-card{
  position:relative;z-index:2;
  width:min(320px,78%);
  aspect-ratio:4/5;
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:14px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.018));
  box-shadow:
    0 35px 90px rgba(0,0,0,.46),
    0 0 0 1px rgba(217,255,63,.035);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.portrait-card::before{
  content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.07);
  border-radius:18px;pointer-events:none;
}
.portrait-card::after{
  content:"";position:absolute;width:90px;height:90px;
  right:-35px;bottom:-35px;border-radius:50%;
  background:rgba(217,255,63,.08);filter:blur(8px);
}
.portrait-card img{
  position:relative;z-index:2;
  max-width:100%;max-height:100%;
  width:auto;height:auto;object-fit:contain;
  display:block;border-radius:15px;
  filter:saturate(.92) contrast(1.04);
  user-select:none;-webkit-user-drag:none;
}
.portrait-number{
  position:absolute;z-index:4;left:22px;top:19px;
  color:#747b84;font-size:10px;font-weight:900;letter-spacing:.16em;
}
.portrait-tag{
  position:absolute;z-index:4;right:18px;bottom:18px;
  padding:7px 9px;border-radius:8px;
  background:rgba(7,8,9,.72);border:1px solid rgba(255,255,255,.12);
  color:#b9bec4;font-size:8px;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;backdrop-filter:blur(10px);
}
.portrait-caption{
  position:absolute;z-index:3;left:34px;bottom:27px;
  color:#555b63;font-size:8px;letter-spacing:.16em;text-transform:uppercase;
}

/* info side */
.info{
  position:relative;min-width:0;
  padding:clamp(74px,8vh,108px) clamp(30px,5vw,88px) 42px;
  display:flex;flex-direction:column;justify-content:center;
  overflow:hidden;
}
.info::before{
  content:"EXPERT PROFILE";
  position:absolute;right:48px;top:83px;
  color:#282d33;font-size:9px;font-weight:900;letter-spacing:.22em;
}
.info::after{
  content:"";
  position:absolute;right:-130px;bottom:-160px;width:390px;height:390px;
  border:1px solid rgba(217,255,63,.06);border-radius:50%;
  box-shadow:0 0 0 28px rgba(217,255,63,.012),0 0 0 58px rgba(217,255,63,.008);
  pointer-events:none;
}
.eyebrow{
  color:var(--lime);font-size:11px;font-weight:900;
  letter-spacing:.18em;text-transform:uppercase;margin-bottom:13px;
}
.name{
  font-size:clamp(43px,5vw,79px);
  line-height:.92;letter-spacing:-.065em;
  margin:0 0 15px;max-width:900px;text-wrap:balance;
}
.role{
  font-size:15px;line-height:1.55;color:#c5c9ce;
  max-width:720px;margin-bottom:22px;
}
.block-label{
  font-size:9px;font-weight:900;letter-spacing:.17em;
  text-transform:uppercase;color:#656b73;margin:4px 0 9px;
}
.subjects{
  display:flex;flex-wrap:wrap;gap:7px;margin-bottom:17px;
}
.subject{
  padding:10px 13px;border:1px solid #30343a;
  background:linear-gradient(135deg,rgba(217,255,63,.06),rgba(255,255,255,.015));
  border-radius:10px;color:#e0e3e6;font-size:12px;font-weight:750;
}
.prof-grid{display:grid;grid-template-columns:minmax(240px,390px);gap:8px;margin-bottom:15px}
.prof{
  border:1px solid #30343a;
  background:rgba(255,255,255,.018);
  padding:12px 14px;border-radius:12px;
}
.prof span{
  display:block;color:#656b73;font-size:8px;font-weight:900;
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;
}
.prof strong{
  display:block;color:#eef0f2;font-size:12px;line-height:1.35;font-weight:650;
}
.human{
  max-width:780px;
  background:rgba(255,255,255,.018);
  border:1px solid rgba(255,255,255,.09);
  border-left:3px solid var(--lime);
  border-radius:0 13px 13px 0;
  padding:13px 16px;margin-top:2px;
}
.human .human-line{color:#dfe2e5;font-size:13px;line-height:1.55}
.human .human-line b{color:var(--lime)}
.demo{display:none}
.hint{
  position:absolute;left:30px;bottom:27px;color:#555b63;font-size:9px;
}
.key{
  display:inline-block;border:1px solid #30343a;border-radius:5px;
  padding:3px 5px;color:#afb4ba;margin-right:2px;
}
.nav{
  position:absolute;right:30px;bottom:24px;display:flex;gap:7px;z-index:10;
}
.nav button{
  width:44px;height:44px;border:1px solid #30343a;
  background:#111318;color:#fff;border-radius:50%;font-size:17px;
  cursor:pointer;transition:.2s ease;
}
.nav button:hover{transform:translateY(-2px);background:#202329;border-color:#4a4f57}

/* RESPONSIVE */
@media(max-width:900px){
  .profile{grid-template-columns:1fr;grid-template-rows:43% 57%}
  .portrait-zone{
    padding:55px 20px 18px;border-right:0;border-bottom:1px solid rgba(255,255,255,.07);
  }
  .portrait-card{height:90%;width:auto;aspect-ratio:4/5}
  .portrait-caption{display:none}
  .info{
    padding:20px 23px 66px;justify-content:flex-start;
  }
  .info::before{display:none}
  .eyebrow{margin-bottom:9px}
  .name{font-size:clamp(34px,9vw,60px);margin-bottom:9px}
  .role{font-size:13px;margin-bottom:11px}
  .block-label{margin-top:0}
  .subjects{margin-bottom:11px}
  .subject{padding:8px 10px;font-size:10px}
  .prof-grid{gap:6px;margin-bottom:10px}
  .prof{padding:9px 10px}
  .human{padding:10px 12px}
  .human .human-line{font-size:11px}
  .top{left:20px;right:20px}
  .progress{width:58vw}
  .hint{left:20px;bottom:27px}
  .nav{right:20px;bottom:14px}
}
@media(max-width:560px){
  .intro h2{font-size:clamp(48px,15vw,82px)}
  .college-mark img{width:120px}
  .intro-overline{font-size:9px}
  .intro-lead{font-size:13px!important}
  .intro-tease{font-size:9px}
  .intro-tease span{padding:8px 10px}
  .portrait-card{height:86%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
}


.fallback{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:110px;font-weight:900;color:#24282d;letter-spacing:-.09em;
}

</style>
</head>

<body>
<div class="app">
  <div class="top">
    <div class="logo">MEET / ZAFK</div>
    <div class="counter" id="counter"></div>
  </div>

  <div class="progress" id="progress"></div>
  <main class="stage" id="stage"></main>
</div>

<script>
const people = [
  {name:"Мітін Вадим Павлович", photo:"./Циклова комісія комп'ютерних дисциплін_files/mitin.jpg", role:"Викладач комп’ютерних дисциплін", subjects:["Комп’ютерна схемотехніка"], category:"Вища кваліфікаційна категорія", focus:"Цікавиться цифровою схемотехнікою, логічними елементами та тим, як із окремих компонентів створюються цілісні комп’ютерні системи."},
  {name:"Кучеренко Ярослав Костянтинович", photo:"./Циклова комісія комп'ютерних дисциплін_files/kucherenko.jpg", role:"Викладач комп’ютерних дисциплін", subjects:["Вебтехнології і вебдизайн"], category:"Друга кваліфікаційна категорія", focus:"Цікавиться веброзробкою, сучасним вебдизайном, зручністю інтерфейсів та створенням сайтів, які поєднують технологічність і привабливий вигляд."},
  {name:"Пономарьова Лариса Валеріївна", photo:"./Циклова комісія комп'ютерних дисциплін_files/ponomareva.jpg", role:"Викладачка комп’ютерних дисциплін", subjects:["Організація баз даних"], category:"Вища кваліфікаційна категорія", focus:"Цікавиться організацією даних, побудовою структурованих баз та тим, як правильно зберігати, впорядковувати й знаходити потрібну інформацію."},
  {name:"Кичак Артем Андрійович", photo:"./Циклова комісія комп'ютерних дисциплін_files/kichak.jpg", role:"Викладач комп’ютерних дисциплін", subjects:["Системне програмування та операційні системи"], category:"Друга кваліфікаційна категорія", focus:"Цікавиться принципами роботи операційних систем, системним програмуванням, процесами, пам’яттю та тим, що відбувається всередині комп’ютера."},
  {name:"Кухар Микола Вікторович", photo:"./Циклова комісія комп'ютерних дисциплін_files/kuhar.jpg", role:"Викладач комп’ютерних дисциплін", subjects:["Архітектура комп’ютерів"], category:"Друга кваліфікаційна категорія", focus:"Цікавиться архітектурою комп’ютерів, взаємодією процесора, пам’яті та пристроїв і тим, як побудована сучасна обчислювальна техніка."},
  {name:"Тіменко Катерина Ігорівна", photo:"./Циклова комісія комп'ютерних дисциплін_files/timenko.jpg", role:"Викладачка комп’ютерних дисциплін", subjects:["Комп’ютерні мережі"], category:"Вища кваліфікаційна категорія", focus:"Цікавиться комп’ютерними мережами, передаванням даних, мережевими технологіями та принципами надійного з’єднання пристроїв."},
  {name:"Тіменко Артур Валентинович", photo:"./Циклова комісія комп’ютерних дисциплін_files/timenko2.jpg", role:"Викладач комп’ютерних дисциплін", subjects:["Основи інтернет речей"], category:"Вища кваліфікаційна категорія", focus:"Цікавиться Інтернетом речей, розумними пристроями, сенсорами та тим, як фізичні об’єкти можуть взаємодіяти між собою через мережу."},
  {name:"Шишкін Микола Миколайович", photo:"./Циклова комісія комп’ютерних дисциплін_files/shishkin.jpg", role:"Викладач комп’ютерних дисциплін", subjects:["Теорія ймовірностей"], category:"Вища кваліфікаційна категорія", focus:"Цікавиться математичними моделями невизначеності, ймовірнісними закономірностями та їх практичним застосуванням в інформаційних технологіях."},
  {name:"Попов Дмитро Іванович", photo:"./Циклова комісія комп'ютерних дисциплін_files/popov.jpg", role:"Викладач комп’ютерних дисциплін", subjects:["Комп’ютерна графіка"], category:null, focus:"Цікавиться комп’ютерною графікою, цифровими зображеннями, візуалізацією та способами перетворення ідей на яскравий цифровий результат."},
  {name:"Ковальова Вікторія Петрівна", photo:"./Циклова комісія комп'ютерних дисциплін_files/kovaleva.jpg", role:"Викладачка комп’ютерних дисциплін", subjects:["Програмування"], category:"Вища кваліфікаційна категорія", focus:"Цікавиться програмуванням, алгоритмами, логікою розробки та створенням власних програм від ідеї до готового результату."}

let index = 0;

const stage = document.getElementById("stage");
const progress = document.getElementById("progress");
const counter = document.getElementById("counter");

function initials(name){
  const a = name.trim().split(/\s+/);
  return (a[0]?.[0] || "") + (a[1]?.[0] || "");
}

function go(n){
  index = Math.max(0, Math.min(people.length, n));
  render();
}

function introMarkup(){
  return `
    <section class="intro">
      <div class="intro-grid"></div>
      <div class="orb a"></div>
      <div class="orb b"></div>

function personMarkup(p, i){
  return `
    <section class="slide">
      <div class="profile">

        <div class="portrait-zone">
          <div class="portrait-card">
            <div class="portrait-number">${String(i+1).padStart(2,"0")} / ${String(people.length).padStart(2,"0")}</div>

            <img
              src="${p.photo}"
              alt="${p.name}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
            >

            <div class="fallback" style="display:none">${initials(p.name)}</div>
            <div class="portrait-tag">ZAFK · IT TEAM</div>
          </div>

          <div class="portrait-caption">PERSON / ${String(i+1).padStart(2,"0")} · COMPUTER DISCIPLINES</div>
        </div>

        <div class="info">
          <div class="eyebrow">Профіль викладача · ${String(i+1).padStart(2,"0")}</div>

          <h1 class="name">${p.name}</h1>

          <div class="role">${p.role}</div>

          <div class="block-label">Експертиза</div>
          <div class="subjects">
            ${p.subjects.map(s => `<span class="subject">${s}</span>`).join("")}
          </div>

          ${p.category ? `
          <div class="block-label">Професійний статус</div>
          <div class="prof-grid">
            <div class="prof">
              <span>Кваліфікаційна категорія</span>
              <strong>${p.category}</strong>
            </div>
          </div>
          ` : ""}

          <div class="human">
            <div class="human-line"><b>Професійний фокус</b><br>${p.focus}</div>
          </div>

          <div class="hint">
            <span class="key">←</span>
            <span class="key">→</span>
            гортай профілі
          </div>

          <div class="nav">
            <button onclick="go(index-1)" aria-label="Попередній викладач">←</button>
            <button onclick="go(index+1)" aria-label="Наступний викладач">→</button>
          </div>
        </div>

      </div>
    </section>
  `;
}

function render(){
  stage.innerHTML = [
    introMarkup(),
    ...people.map(personMarkup)
  ].join("");

  progress.innerHTML = Array.from(
    {length: people.length + 1},
    (_, i) => `<span class="${i === index ? "on" : ""}"></span>`
  ).join("");

  counter.textContent =
    `${String(index + 1).padStart(2,"0")} / ${String(people.length + 1).padStart(2,"0")}`;

  stage.style.transform = `translateX(-${index * 100}%)`;
}

/* Keyboard */
addEventListener("keydown", e => {
  if(e.key === "ArrowRight" || e.key === " "){
    e.preventDefault();
    go(index + 1);
  }
  if(e.key === "ArrowLeft"){
    e.preventDefault();
    go(index - 1);
  }
});

/* Swipe / drag */
let sx = null;

addEventListener("pointerdown", e => {
  sx = e.clientX;
});

addEventListener("pointerup", e => {
  if(sx == null) return;
  const dx = e.clientX - sx;

  if(Math.abs(dx) > 45){
    go(index + (dx < 0 ? 1 : -1));
  }

  sx = null;
});

/* Mouse wheel */
let wheelLock = false;

addEventListener("wheel", e => {
  if(wheelLock || Math.abs(e.deltaY) < 18) return;
  wheelLock = true;
  go(index + (e.deltaY > 0 ? 1 : -1));
  setTimeout(() => wheelLock = false, 750);
}, {passive:true});

render();
</script>
</body>
</html>
